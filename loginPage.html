<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Graphene Trace</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <h2>Login to Graphene Trace</h2>

        <form id="loginForm">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit" class="btn-primary">Login</button>

            <p class="switch-link">
                Don't have an account? <a href="register.html">Register here</a>
            </p>

            <p id="errorMsg" class="error"></p>
        </form>
    </div>

    <script>
// Predefined accounts
const users = {
    "admin@graphene.com": { password: "admin123", role: "admin" },
    "clinician@graphene.com": { password: "clinician123", role: "clinician" },
    "patient@graphene.com": { password: "patient123", role: "patient" }
};

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.toLowerCase();
    const password = document.getElementById("password").value;

    if (users[email] && users[email].password === password) {

        // Redirect based on role
        if (users[email].role === "admin")
            window.location.href = "admin-dashboard.html";
        else if (users[email].role === "clinician")
            window.location.href = "clinician-dashboard.html";
        else
            window.location.href = "patient-dashboard.html";

    } else {
        document.getElementById("errorMsg").textContent =
            "Invalid email or password. Please try again.";
    }
});
    </script>

</body>
</html>
