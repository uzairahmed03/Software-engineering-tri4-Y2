<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapheneTrace - Login</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #1a0f2e;
            color: #e3dffa;
        }

        .container {
            max-width: 420px;
            margin: 110px auto;
            padding: 30px;
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h1 {
            color: #d8b4fe;
            margin-bottom: 20px;
        }

        /* Input fields */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: #2c1a47;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }

            input::placeholder {
                color: #bda7e6;
            }

        /* Dropdown */
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #2c1a47;
            border: 1px solid rgba(255,255,255,0.2);
            color: #e3dffa;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(124,58,237,0.4);
        }

            .btn:hover {
                background: #6d28d9;
            }

        .link {
            margin-top: 15px;
            display: block;
            color: #c084fc;
            text-decoration: none;
        }

            .link:hover {
                text-decoration: underline;
            }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #a78bfa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Login</h1>

        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">

        <select>
            <option>Select Role</option>
            <option>Admin</option>
            <option>Clinician</option>
            <option>Patient</option>
        </select>

        <button class="btn">Login</button>

        <a href="register.html" class="link">Don't have an account? Register</a>
    </div>

    <footer>
        © 2025 GrapheneTrace
    </footer>

</body>
</html>
