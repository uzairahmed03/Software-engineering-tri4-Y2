<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrapheneTrace - Patient Dashboard</title>

    <style>
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: #1a0f2e; color: #e3dffa; }

        .topbar {
            background: #2c1a47;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d8b4fe;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }

        .topbar h1 { margin: 0; font-size: 22px; }

        .btn-logout {
            background: #7c3aed;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-logout:hover { background: #6d28d9; }

        .dashboard {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            gap: 25px;
            padding: 30px;
        }

        .card {
            background: rgba(255,255,255,0.06);
            padding: 22px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card h2 { margin-top: 0; color: #d8b4fe; }

        .profile-info p { font-size: 16px; margin: 6px 0; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .metric-block {
            text-align: center;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .metric-block h3 { margin-bottom: 10px; color: #c084fc; }

        .metric-block p { font-size: 22px; }

        /* Heatmap area keeps original card look */
        .heatmap-container {
            height: 280px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 15px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(32, 1fr);
            gap: 2px;
        }

        .heatmap-cell {
            border-radius: 2px;
            background: rgba(255,255,255,0.06);
        }

        .slider { width: 100%; }

        .alert-box {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff6b6b;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .btn {
            background: #7c3aed;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover { background: #6d28d9; }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #a78bfa;
        }
    </style>
</head>

<body>

<div class="topbar">
    <h1>Patient Dashboard</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
</div>

<div class="dashboard">

    <!-- LEFT -->
    <div class="left">

        <div class="card profile-info">
            <h2>Patient Information</h2>
            <p><strong>Name:</strong> <span id="name">—</span></p>
            <p><strong>Email:</strong> <span id="email">—</span></p>
            <p><strong>Assigned Clinician:</strong> Dr. Smith</p>
        </div>

        <div class="card">
            <h2>Latest Metrics</h2>

            <div class="metrics-grid">
                <div class="metric-block">
                    <h3>Peak Pressure</h3>
                    <p id="peak">—</p>
                </div>

                <div class="metric-block">
                    <h3>Contact Area</h3>
                    <p id="contact">—</p>
                </div>

                <div class="metric-block">
                    <h3>Frame Count</h3>
                    <p id="frames">—</p>
                </div>
            </div>
        </div>

        <div class="card emergency">
            <h3>Emergency Contact</h3>
            <p>📞 +44 0208 555 9111</p>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="card">
            <h2>Heatmap & Frame Viewer</h2>

            <!-- REAL HEATMAP -->
            <div id="heatmap" class="heatmap-container"></div>

            <input id="rowSlider" type="range" min="0" max="1000" value="0" class="slider">
        </div>

        <div class="card">
            <h2>Active Alerts</h2>
            <div id="alerts"></div>
        </div>

    </div>

</div>

<footer>
    © 2025 GrapheneTrace · Patient Dashboard
</footer>

<script>
const API = "";
const user = JSON.parse(localStorage.getItem("loggedInUser"));

if (!user || user.role === 0 || user.role === 2) {
    location.href = "login.html";
}

document.getElementById("name").textContent = user.fullName;
document.getElementById("email").textContent = user.email;

// ---- EXISTING METRICS ----
async function loadMetrics() {
    const res = await fetch(`${API}/api/metrics/latest`);
    const m = await res.json();

    document.getElementById("peak").textContent = m.peakPressure;
    document.getElementById("contact").textContent = m.contactArea;
    document.getElementById("frames").textContent = m.frameCount || "—";
}

// ---- EXISTING ALERTS ----
async function loadAlerts() {
    const res = await fetch(`${API}/api/alerts`);
    const alerts = await res.json();

    const box = document.getElementById("alerts");
    box.innerHTML = "";

    alerts.filter(a => a.isActive).forEach(a => {
        box.innerHTML += `<div class="alert-box">${a.severity}: ${a.message}</div>`;
    });
}

// ---- CSV HEATMAP ----
const SOURCE_ID = "1c0fd777";
const MEASURE_DATE = "2025-10-11";
const SIZE = 32;

const heatmap = document.getElementById("heatmap");
const slider = document.getElementById("rowSlider");

function renderHeatmap(values) {
    heatmap.innerHTML = "";

    const flat = values.flat().filter(v => Number.isFinite(v));
    const min = Math.min(...flat);
    const max = Math.max(...flat);
    const range = (max - min) || 1;

    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const v = values[r][c];
            const cell = document.createElement("div");
            cell.className = "heatmap-cell";

            if (Number.isFinite(v)) {
                const t = (v - min) / range;
                cell.style.background = `rgba(192,132,252,${0.2 + 0.7 * t})`;
            }

            heatmap.appendChild(cell);
        }
    }
}

async function loadHeatmap(startRow) {
    const res = await fetch(
        `${API}/api/csv/heatmap?sourceId=${SOURCE_ID}&date=${MEASURE_DATE}&startRow=${startRow}&size=${SIZE}`
    );

    if (!res.ok) return;

    const data = await res.json();
    renderHeatmap(data.values);
}

slider.addEventListener("input", () => {
    loadHeatmap(parseInt(slider.value, 10));
});

function logout() {
    localStorage.clear();
    location.href = "index.html";
}

// INITIAL LOAD
loadMetrics();
loadAlerts();
loadHeatmap(0);
setInterval(() => { loadMetrics(); loadAlerts(); }, 10000);
</script>

</body>
</html>
